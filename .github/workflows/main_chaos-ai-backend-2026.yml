name: Deploy Chaos AI Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_chaos-ai-backend-2026.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0BF05E413579468DA9A16339EB918D57 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AEBC9BD49FF244DF8263A8A3C511229C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F5794035AC764D0086B49EC6296447F3 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "chaos-ai-backend-2026"
          slot-name: "Production"
          package: .
